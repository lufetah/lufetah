<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; background: #fff; font-family: -apple-system, Segoe UI, sans-serif; }
  .gh { max-width: 1012px; margin: 0 auto; padding: 32px; }
  .label { color: #777; font-size: 12px; margin: 24px 0 8px; font-family: monospace; }
  .dark { background: #0d1117; }
  img { max-width: 100%; }
  .center { text-align: center; }
</style>
</head>
<body>
  <div class="gh">
    <div class="label">— as &lt;img&gt; on GitHub LIGHT theme (sandboxed: embedded font must work here) —</div>
    <div class="center"><img src="assets/profile.svg" width="880" /></div>
    <div class="label">— connect badges —</div>
    <div class="center">
      <img src="assets/connect-github.svg" height="38" />
      <img src="assets/connect-x.svg" height="38" />
      <img src="assets/connect-website.svg" height="38" />
      <img src="assets/connect-email.svg" height="38" />
    </div>
  </div>
  <div class="gh dark">
    <div class="label" style="color:#888">— as &lt;img&gt; on GitHub DARK theme —</div>
    <div class="center"><img src="assets/profile.svg" width="880" /></div>
  </div>
</body>
</html>
